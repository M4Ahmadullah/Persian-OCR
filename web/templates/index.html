<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشخیص متن فارسی - Persian OCR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 1rem;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }
        
        .upload-section.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
        }
        
        .preview {
            margin-top: 20px;
            display: none;
        }
        
        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .result-section {
            margin-top: 30px;
            display: none;
        }
        
        .result-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
        }
        
        .result-label {
            color: #00d4ff;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .result-text {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
        }
        
        .confidence {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #ff6b6b;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            color: #00d4ff;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>تشخیص متن فارسی</h1>
            <p class="subtitle">Persian OCR - EasyOCR</p>
        </header>
        
        <div class="upload-section" id="dropZone">
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="upload-btn">
                📁 بارگذاری تصویر
            </label>
            <p style="margin-top: 15px; color: #666;">یا تصویر را اینجا بکشید</p>
            
            <div class="preview" id="preview">
                <img id="previewImg" src="" alt="Preview">
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>در حال پردازش...</p>
        </div>
        
        <div class="result-section" id="result">
            <div class="result-box">
                <div class="result-label">📝 متن تشخیص داده شده:</div>
                <div class="result-text" id="resultText"></div>
                <div class="confidence">
                    اعتماد: <span id="confidence">0</span>%
                </div>
            </div>
        </div>
        
        <div class="error" id="error" style="display: none;"></div>
    </div>
    
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const confidence = document.getElementById('confidence');
        const error = document.getElementById('error');
        
        // Handle file selection
        fileInput.addEventListener('change', handleFile);
        
        // Handle drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFiles(files[0]);
            }
        });
        
        function handleFile(e) {
            const file = e.target.files[0];
            handleFiles(file);
        }
        
        function handleFiles(file) {
            if (!file) return;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Upload and process
            uploadFile(file);
        }
        
        async function uploadFile(file) {
            // Show loading
            preview.style.display = 'none';
            resultSection.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.success) {
                    resultText.textContent = data.text || '(خالی)';
                    confidence.textContent = data.confidence || 0;
                    resultSection.style.display = 'block';
                } else {
                    error.textContent = data.error || 'خطای ناشناخته';
                    error.style.display = 'block';
                    preview.style.display = 'block';
                }
            } catch (e) {
                loading.style.display = 'none';
                error.textContent = 'خطا در اتصال به سرور';
                error.style.display = 'block';
                preview.style.display = 'block';
            }
        }
    </script>
</body>
</html>
